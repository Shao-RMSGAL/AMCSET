<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
  <title>Mixed precision: what one collision computes in single and in double precision</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h{font-weight:700;font-size:15px;fill:#0f172a}
      .s{fill:#1e293b}
      .m{fill:#475569;font-size:11.5px}
      .f{fill:#fef3c7;stroke:#d97706;stroke-width:1.3}
      .d{fill:#dbeafe;stroke:#2563eb;stroke-width:1.3}
      .x{fill:#fee2e2;stroke:#dc2626;stroke-width:1.6}
      .ln{stroke:#334155;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text class="h" x="20" y="28">compute.precision = mixed: one flight and collision, by precision</text>
  <rect class="f" x="660" y="12" width="18" height="14" rx="3"/><text class="m" x="684" y="24">single (float)</text>
  <rect class="d" x="780" y="12" width="18" height="14" rx="3"/><text class="m" x="804" y="24">double</text>
  <rect class="x" x="868" y="12" width="18" height="14" rx="3"/><text class="m" x="892" y="24">double: was float</text>

  <!-- flight -->
  <rect class="d" x="20" y="50" width="200" height="66" rx="8"/>
  <text class="s" x="120" y="72" text-anchor="middle">position x, y, z; energy E</text>
  <text class="m" x="120" y="90" text-anchor="middle">flight path L, tallies, depth bins</text>
  <text class="m" x="120" y="105" text-anchor="middle">(accumulate: double)</text>
  <rect class="f" x="250" y="50" width="200" height="66" rx="8"/>
  <text class="s" x="350" y="72" text-anchor="middle">stopping S(E) interpolation</text>
  <text class="m" x="350" y="90" text-anchor="middle">√L straggling, unit conversions</text>
  <text class="m" x="350" y="105" text-anchor="middle">by reciprocals</text>
  <rect class="f" x="480" y="50" width="200" height="66" rx="8"/>
  <text class="s" x="580" y="72" text-anchor="middle">impact parameter p = √R · p_max</text>
  <text class="m" x="580" y="90" text-anchor="middle">p_max(ε) and √R in float;</text>
  <text class="m" x="580" y="105" text-anchor="middle">ε and b = p/a in double</text>
  <path class="ln" d="M220,83 L250,83"/><path class="ln" d="M450,83 L480,83"/>

  <!-- magic formula -->
  <rect x="20" y="140" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="s" x="36" y="162" font-weight="600">Magic formula (TRIM's Tmagic): sin²(θ/2) from ε and b</text>
  <rect class="f" x="36" y="176" width="230" height="96" rx="8"/>
  <text class="s" x="151" y="198" text-anchor="middle">closest approach r₀</text>
  <text class="m" x="151" y="216" text-anchor="middle">Newton on F(r) = r − Φ(r)/ε − b²/r</text>
  <text class="m" x="151" y="232" text-anchor="middle">four expf per iteration,</text>
  <text class="m" x="151" y="248" text-anchor="middle">to 4·10⁻⁷ (TRIM.exe: 3·10⁻⁴)</text>
  <rect class="x" x="290" y="176" width="210" height="96" rx="8"/>
  <text class="s" x="395" y="198" text-anchor="middle">one Newton step in double</text>
  <text class="m" x="395" y="216" text-anchor="middle">r₀ good to ~10⁻¹³: r₀ − b is</text>
  <text class="m" x="395" y="232" text-anchor="middle">a small difference for distant</text>
  <text class="m" x="395" y="248" text-anchor="middle">collisions (the common ones)</text>
  <rect class="f" x="524" y="176" width="190" height="96" rx="8"/>
  <text class="s" x="619" y="198" text-anchor="middle">fit constants A, G</text>
  <text class="m" x="619" y="216" text-anchor="middle">α, β, γ (√ε, powf(b, β))</text>
  <text class="m" x="619" y="232" text-anchor="middle">enter only through δ</text>
  <rect class="x" x="738" y="176" width="226" height="96" rx="8"/>
  <text class="s" x="851" y="198" text-anchor="middle">ρ, δ, cos(θ/2) and</text>
  <text class="s" x="851" y="214" text-anchor="middle">sin²(θ/2) = 1 − cos² in double</text>
  <text class="m" x="851" y="232" text-anchor="middle">1 − cos² cancels: in float the</text>
  <text class="m" x="851" y="248" text-anchor="middle">small angles were biased</text>
  <path class="ln" d="M266,224 L290,224"/><path class="ln" d="M500,224 L524,224"/><path class="ln" d="M714,224 L738,224"/>

  <!-- kinematics and rotation -->
  <rect class="f" x="20" y="314" width="300" height="70" rx="8"/>
  <text class="s" x="170" y="336" text-anchor="middle">kinematics: recoil energy T = γE sin²(θ/2)</text>
  <text class="m" x="170" y="354" text-anchor="middle">lab angles, azimuth; damage-energy partition</text>
  <text class="m" x="170" y="370" text-anchor="middle">(powf); the energy transfer T stays double</text>
  <rect class="x" x="350" y="314" width="300" height="70" rx="8"/>
  <text class="s" x="500" y="336" text-anchor="middle">rotation of the direction (DIRCOS)</text>
  <text class="m" x="500" y="354" text-anchor="middle">sin² of the polar angle = y² + z², not 1 − x²:</text>
  <text class="m" x="500" y="370" text-anchor="middle">near the axis 1 − x² in float is quantized</text>
  <rect class="d" x="680" y="314" width="300" height="70" rx="8"/>
  <text class="s" x="830" y="336" text-anchor="middle">recoil stack, tallies, exit lists</text>
  <text class="m" x="830" y="354" text-anchor="middle">energies, positions and every sum</text>
  <text class="m" x="830" y="370" text-anchor="middle">in double; random numbers as on the CPU</text>
  <path class="ln" d="M320,349 L350,349"/><path class="ln" d="M650,349 L680,349"/>

  <text class="m" x="20" y="414">Found by tools/gpu_compare: before the two red parts moved to double, the radial range of 100 keV H in Si came out 0.4 % too large (z = 4.2, OpenCL 3.7).</text>
  <text class="m" x="20" y="432">After: 10 × 500,000 ions per backend, every |z| below 2. The same mixed kernel compiled for the CPU (reference backend) agrees as well, so what is left</text>
  <text class="m" x="20" y="450">between a GPU and the CPU is the vendors' math libraries, last bits that only reorder histories. Double precision keeps the CPU's arithmetic exactly.</text>
</svg>
