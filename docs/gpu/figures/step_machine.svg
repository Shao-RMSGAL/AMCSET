<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>The step machine of one GPU lane (amk_step)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .st{stroke-width:2;rx:14}
      .n{fill:#ede9fe;stroke:#7c3aed}
      .i{fill:#ffedd5;stroke:#ea580c}
      .c{fill:#fee2e2;stroke:#dc2626}
      .a{fill:#fef9c3;stroke:#ca8a04}
      .d{fill:#e2e8f0;stroke:#475569}
      .h{font-weight:700;font-size:15px;fill:#0f172a}
      .s{fill:#334155;font-size:12px}
      .e{fill:#1e293b;font-size:12px}
      .ln{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .bad{stroke:#dc2626;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#r)}
    </style>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="490" y="22" text-anchor="middle" font-weight="600" font-size="16" fill="#0f172a">One lane = one work item: it advances its block by one step per iteration</text>
  <text x="490" y="40" text-anchor="middle" class="s">a launch runs each lane for up to "steps" iterations (0.05–0.2 s); the lane's whole state (KLane, 88-byte movers, its recoil stack) stays in device memory between launches</text>

  <!-- NEXT_ION -->
  <rect class="st n" x="60" y="90" width="250" height="150"/>
  <text class="h" x="185" y="115" text-anchor="middle">NEXT_ION</text>
  <text class="s" x="185" y="137" text-anchor="middle">ions left in the block → start the next</text>
  <text class="s" x="185" y="153" text-anchor="middle">ion (its own random stream)</text>
  <text class="s" x="185" y="175" text-anchor="middle">block finished → slot_block[d % ring] = d+1;</text>
  <text class="s" x="185" y="191" text-anchor="middle">take block d = counter (atomic CAS)</text>
  <text class="s" x="185" y="207" text-anchor="middle">only if d &lt; limit (= merged + ring);</text>
  <text class="s" x="185" y="223" text-anchor="middle">else wait for the next launch</text>

  <!-- ION -->
  <rect class="st i" x="400" y="90" width="230" height="120"/>
  <text class="h" x="515" y="115" text-anchor="middle">ION</text>
  <text class="s" x="515" y="137" text-anchor="middle">one free flight + electronic loss</text>
  <text class="s" x="515" y="153" text-anchor="middle">+ one collision (magic formula)</text>
  <text class="s" x="515" y="171" text-anchor="middle">run_ion_2013 (IONCYCLE) per step;</text>
  <text class="s" x="515" y="187" text-anchor="middle">quick damage: Kinchin–Pease here</text>

  <!-- CASCADE -->
  <rect class="st c" x="720" y="90" width="220" height="120"/>
  <text class="h" x="830" y="115" text-anchor="middle">CASCADE</text>
  <text class="s" x="830" y="137" text-anchor="middle">one step of TRIM's recoil</text>
  <text class="s" x="830" y="153" text-anchor="middle">stack (RECOILLOOP /</text>
  <text class="s" x="830" y="169" text-anchor="middle">NEXTRECOIL): push, follow, pop</text>
  <text class="s" x="830" y="187" text-anchor="middle">slots in the lane's own stack</text>

  <!-- AFTER_CASCADE -->
  <rect class="st a" x="600" y="300" width="250" height="100"/>
  <text class="h" x="725" y="325" text-anchor="middle">AFTER_CASCADE</text>
  <text class="s" x="725" y="347" text-anchor="middle">the ion's loop after its cascade</text>
  <text class="s" x="725" y="363" text-anchor="middle">(TRIM.DAT recoil events: the</text>
  <text class="s" x="725" y="379" text-anchor="middle">event's end)</text>

  <!-- DONE -->
  <rect class="st d" x="60" y="320" width="250" height="80"/>
  <text class="h" x="185" y="347" text-anchor="middle">DONE</text>
  <text class="s" x="185" y="369" text-anchor="middle">no device block left: the lane</text>
  <text class="s" x="185" y="385" text-anchor="middle">counts itself in counter[1]</text>

  <!-- transitions -->
  <path class="ln" d="M310,140 L400,140"/>
  <text class="e" x="355" y="132" text-anchor="middle">ion begins</text>
  <path class="ln" d="M630,130 L720,130"/>
  <text class="e" x="675" y="122" text-anchor="middle">full cascade</text>
  <path class="ln" d="M830,210 L800,300"/>
  <text class="e" x="842" y="262">stack empty</text>
  <path class="ln" d="M640,300 L560,210"/>
  <text class="e" x="545" y="270" text-anchor="end">ion continues</text>
  <path class="ln" d="M440,210 C430,260 360,250 300,240"/>
  <text class="e" x="400" y="268" text-anchor="middle">ion stops, leaves,</text>
  <text class="e" x="400" y="283" text-anchor="middle">or is backscattered</text>
  <path class="ln" d="M185,240 L185,320"/>
  <text class="e" x="195" y="285">counter ≥ blocks</text>
  <path class="ln" d="M630,180 C680,190 690,170 630,165" opacity="0"/>
  <!-- ion self-loop -->
  <path class="ln" d="M470,90 C470,62 560,62 560,90"/>
  <text class="e" x="515" y="62" text-anchor="middle">next flight</text>
  <!-- cascade self-loop -->
  <path class="ln" d="M790,90 C790,62 880,62 880,90"/>
  <text class="e" x="835" y="62" text-anchor="middle">next recoil step</text>
  <!-- failure -->
  <rect x="330" y="316" width="245" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 4"/>
  <text x="452" y="336" fill="#b91c1c" font-size="12" text-anchor="middle">in ION or CASCADE: recoil stack or</text>
  <text x="452" y="351" fill="#b91c1c" font-size="12" text-anchor="middle">exit list full (status ≠ OK) → the block</text>
  <text x="452" y="366" fill="#b91c1c" font-size="12" text-anchor="middle">is given back; the CPU reruns it</text>
  <path class="bad" d="M330,330 L290,240"/>

  <!-- why box -->
  <rect x="60" y="430" width="880" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="455" font-weight="600" fill="#0f172a">Why a step machine</text>
  <text x="80" y="477" class="s">A wavefront (32 lanes on RDNA3) executes one instruction stream. If every lane ran its own history to the end, lanes in a cascade would</text>
  <text x="80" y="494" class="s">hold the whole wavefront while the others waited. Stepping makes every iteration short and of one of three kinds, so lanes regroup at the switch,</text>
  <text x="80" y="511" class="s">and a launch can stop after any step: the state is in device memory, so launches stay short (the display watchdog, other programs on the GPU)</text>
  <text x="80" y="528" class="s">and the host can merge finished blocks between them. The order of random draws within an ion is exactly the CPU transport's.</text>
</svg>
